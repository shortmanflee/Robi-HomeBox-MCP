# HomeBox MCP server. Point HOMEBOX_URL (in .env) at your existing HomeBox instance.
#
# If HomeBox runs in another compose project, attach to its network instead of using a
# LAN URL, e.g. uncomment `networks` below and set HOMEBOX_URL=http://homebox:7745
services:
  homebox-mcp:
    build: .
    image: homebox-mcp:latest
    container_name: homebox-mcp
    env_file: .env
    ports:
      # host port : container port (MCP_PORT is what the server listens on inside)
      - "${MCP_PUBLISH_PORT:-${MCP_PORT:-8000}}:${MCP_PORT:-8000}"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
#    networks: [homebox]

